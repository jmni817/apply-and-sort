# apply-and-sort 설정 예시
# 대시보드에서 설정하면 이 파일이 자동으로 만들어져요. 직접 쓰려면 config.yaml 로 복사하세요.
# config.yaml 에는 개인 시트 주소가 들어가므로 커밋하지 마세요. (.gitignore 에 포함됨)

# 구글 시트 주소 (브라우저 주소창 전체)
spreadsheet_url: "https://docs.google.com/spreadsheets/d/YOUR_SPREADSHEET_ID/edit"

# 지원 기록이 있는 탭 이름
data_sheet: 지원현황

# 회사별 기업규모를 저장하는 탭. 없으면 자동으로 만들어요.
# 여기서 값을 직접 고치면, 다음부터는 그 값을 써요.
cache_sheet: 기업정보

# Google OAuth 파일 (설정 파일 기준 상대 경로)
credentials_path: credentials.json
token_path: token.json

# 데이터 탭 1행의 헤더 이름. 시트 헤더가 다르면 여기만 바꾸세요.
# 회사·서류 열은 꼭 있어야 하고, 기업규모 열은 없으면 맨 끝에 만들어요.
columns:
  company: 회사
  role: 직무
  channel: 지원형태
  employment: 고용형태
  document: 서류
  size: 기업규모

# (선택) AI로 기업규모 채우기. OpenAI 호환(Chat Completions) API 면 어디든 됩니다.
llm:
  enabled: false
  base_url: ""        # 예: https://api.openai.com/v1, http://127.0.0.1:31415/v1 (freellmapi)
  model: ""           # 예: gpt-4o-mini, auto (freellmapi)
  # API 키는 이 파일에 직접 쓰지 말고 별도 파일에 저장해요. (대시보드에서 등록하면 자동)
  # 환경변수 APPLY_AND_SORT_LLM_API_KEY 가 있으면 그 값을 먼저 써요.
  api_key_path: llm_api_key.txt
