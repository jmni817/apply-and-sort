# Windows 실행 파일(apply-and-sort.exe) 빌드 및 배포
#
# - v로 시작하는 태그를 push 하면 (예: git tag v0.1.0 && git push origin v0.1.0)
#   exe 를 빌드해 GitHub Releases 에 올립니다.
# - Actions 탭에서 수동 실행하면 빌드만 하고, 결과물은 실행 기록의 Artifacts 에서 받을 수 있습니다.
# exe 에는 어떤 API 키/토큰도 들어가지 않습니다. 사용자는 실행 후 대시보드에서 본인 키를 등록합니다.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements-build.txt -e ".[dev]"

      - name: 테스트
        run: pytest -q

      - name: exe 빌드
        run: pyinstaller --noconfirm --clean packaging/apply-and-sort.spec

      - uses: actions/upload-artifact@v4
        with:
          name: apply-and-sort-windows
          path: dist/apply-and-sort.exe

      - name: GitHub Release 에 업로드
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CHANGELOG.md 에서 "## <태그> ..." 부터 다음 "## " 전까지를 릴리스 설명으로 사용
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## " tag " ") == 1 || $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo "**다운로드:** 아래 \`apply-and-sort.exe\`를 받아 더블클릭하면 대시보드 창이 열립니다. 사용법은 README를 참고하세요."
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/apply-and-sort.exe \
            --title "apply-and-sort $GITHUB_REF_NAME" \
            --notes-file notes.md
